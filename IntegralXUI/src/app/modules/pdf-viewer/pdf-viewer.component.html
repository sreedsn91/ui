<div class="pdf-viewer-container">
  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading PDF...</p>
  </div>

  <div *ngIf="error" class="error-state">
    <p>⚠️ {{ error }}</p>
  </div>

  <!-- Remove the *ngIf from this div - canvas must always be present -->
  <div class="viewer-content" [class.hidden]="!pdfDoc || loading"  style="display: block !important;">
    <!-- <div class="sidebar">
      <div class="markers-panel">
        <h3>📍 Marked Points ({{ markers.length }})</h3>
        <div class="markers-list">
          <div *ngIf="markers.length === 0" class="empty-state">
            Click on the PDF to add markers
          </div>
          <div *ngFor="let marker of markers; let i = index" class="marker-item">
            <div class="marker-info">
              <strong>#{{ i + 1 }}</strong> - Page {{ marker.page }}<br>
              <small>X: {{ marker.x.toFixed(0) }}, Y: {{ marker.y.toFixed(0) }}</small>
            </div>
            <button class="btn-remove" (click)="removeMarker(i)">×</button>
          </div>
        </div>
      </div>
    </div> -->

    <div class="main-viewer" style="position: relative;">
      <div class="controls">
        <button 
          class="btn btn-secondary" 
          (click)="prevPage()"
          [disabled]="currentPage === 1"
        >
          ⬅ Previous
        </button>
        <div class="page-info">
          Page {{ currentPage }} of {{ totalPages }}
        </div>
        <button 
          class="btn btn-secondary" 
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          Next ➡
        </button>
        
        <div class="zoom-controls">
          <button 
            class="btn btn-zoom" 
            (click)="zoomOut()"
            [disabled]="scale <= 0.5"
            title="Zoom Out"
          >
            🔍-
          </button>
          <span class="zoom-info">{{ getZoomPercentage() }}%</span>
          <button 
            class="btn btn-zoom" 
            (click)="zoomIn()"
            [disabled]="scale >= 3"
            title="Zoom In"
          >
            🔍+
          </button>
          <button 
            class="btn btn-zoom" 
            (click)="resetZoom()"
            title="Reset Zoom"
          >
            ↻
          </button>
        </div>
        
        <!-- <button class="btn btn-warning" (click)="clearMarkers()">
          Clear All
        </button> -->
      </div>

      <div class="canvas-container">
        <canvas 
          #pdfCanvas
          (click)="onCanvasClick($event)"
        ></canvas>
      </div>
    </div>
  </div>
</div>
