<ag-grid-angular
  class="ag-theme-alpine custom-grid"
  style="width: 100%;
         height: 100vh; 
         padding: 16px;
         box-sizing: border-box;
         --ag-header-height: 50px;
         --ag-header-foreground-color: #1a1a1a;
         --ag-header-background-color: #f8f9fa;
         --ag-odd-row-background-color: #ffffff;
         --ag-row-hover-color: #e3f2fd;
         --ag-selected-row-background-color: #bbdefb;
         --ag-border-color: #e0e0e0;
         --ag-row-border-color: #f0f0f0;
         --ag-font-size: 14px;
         --ag-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
         border-radius: 8px;
         overflow: hidden;"
  [rowData]="rowData"
  [columnDefs]="getUpdatedColumnDefs2()"
  [defaultColDef]="defaultColDef"
  [gridOptions]="gridOptions"
  [groupDisplayType]="'groupRows'"
  rowSelection="single">
</ag-grid-angular>
