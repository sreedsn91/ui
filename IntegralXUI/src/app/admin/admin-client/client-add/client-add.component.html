<div class="">
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
                <!-- Left Side: Heading -->
                <h3 class="m-0">New Client</h3>

                <!-- Right Side: Buttons -->
                <div class="toolbar">
                    <a class="" (click)="backToClient()">
                        <i class="feather styleIcon icon-arrow-left" style="font-size: xx-large;" title="Back to users"></i> 
                    </a>
                </div>
            </div>
            <hr class="hrntm">
            
            <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="p-2">
                <input id="id" formControlName="id" class="form-control form-control-sm small-input" hidden />
                
                <!-- Basic Information Section -->
                <p class="text-muted text-truncate mb-2">Basic Information</p>
                <hr class="mt-0">
                
                <div class="row row-gap m-0"> 
                    <!-- Name -->
                    <div class="col-sm-4 field-container">
                        <label for="name" class="form-label">Name: <span class="text-danger">*</span></label>
                        <div class="input-container">
                            <input id="name" formControlName="name" class="form-control form-control-nb" placeholder="Enter name" />
                        </div>
                        <div *ngIf="clientForm.controls['name'].invalid && clientForm.controls['name'].touched" class="text-danger">
                            <div *ngIf="clientForm.controls['name'].errors?.['name']">
                                Name is required.
                            </div>
                            <div *ngIf="clientForm.controls['name'].errors?.['nameExists']">
                                Name already exist.
                            </div>
                        </div>
                    </div>
                    
                    <!-- Email -->
                    <div class="col-sm-4 field-container">
                        <label for="email" class="form-label">Email: <span class="text-danger">*</span></label>
                        <div class="input-container">
                            <input type="email" id="email" formControlName="email" class="form-control form-control-nb" placeholder="Enter email" />
                        </div>
                        <div *ngIf="clientForm.controls['email'].invalid && clientForm.controls['email'].touched" class="text-danger">
                            <div *ngIf="clientForm.controls['email'].errors?.['email']">
                                Email is required.
                            </div>
                            <div *ngIf="clientForm.controls['email'].errors?.['emailExists']">
                                Email already exist.
                            </div>
                        </div>
                    </div>
                    
                    <!-- Website -->
                    <div class="col-sm-4 field-container">
                        <label for="website" class="form-label">Website: <span class="text-danger">*</span></label>
                        <div class="input-container">
                            <input type="text" id="website" formControlName="website" class="form-control form-control-nb" placeholder="Enter website" />
                        </div>
                        <div *ngIf="clientForm.controls['website'].invalid && clientForm.controls['website'].touched" class="text-danger">
                            Website is required.
                        </div>
                    </div>
                </div>

                <!-- Subscription Details Section -->
                <p class="text-muted text-truncate mb-2 mt-4">Subscription Details</p>
                <hr class="mt-0">
                
                <div class="row row-gap m-0">
                    <!-- Total Users -->
                    <div class="col-sm-4 field-container">
                        <label for="totalUsers" class="form-label">Users: <span class="text-danger">*</span></label>
                        <div class="input-container">
                            <input type="number" id="totalUsers" formControlName="totalUsers" class="form-control form-control-nb" min="1" />
                        </div>
                        <div *ngIf="clientForm.controls['totalUsers'].invalid && clientForm.controls['totalUsers'].touched" class="text-danger">
                            Users must be at least 1.
                        </div>
                    </div>
                    
                    <!-- Purchase Date -->
                    <div class="col-sm-4 field-container">
                        <label for="purchaseDate" class="form-label">Purchase Date: <span class="text-danger">*</span></label>
                        <div class="input-container">
                            <input type="date" id="purchaseDate" formControlName="purchaseDate" class="form-control form-control-nb" />
                        </div>
                        <div *ngIf="clientForm.controls['purchaseDate'].invalid && clientForm.controls['purchaseDate'].touched" class="text-danger">
                            Purchase date is required.
                        </div>
                    </div>

                    <!-- Expiry Date -->
                    <div class="col-sm-4 field-container">
                        <label for="expiryDate" class="form-label">Expiry Date:</label>
                        <div class="input-container">
                            <input type="date" id="expiryDate" formControlName="expiryDate" class="form-control form-control-nb" />
                        </div>
                        <div *ngIf="clientForm.controls['expiryDate'].invalid && clientForm.controls['expiryDate'].touched" class="text-danger">
                            Expiry date is required.
                        </div>
                    </div>
                    
                    <!-- Details (Full Width) -->
                    <div class="col-sm-12 field-container">
                        <label for="details" class="form-label">Details:</label>
                        <div class="input-container">
                            <textarea id="details" formControlName="details" class="form-control form-control-nb" rows="3"></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Modules Section -->
                <p class="text-muted text-truncate mb-2 mt-4">Modules</p>
                <hr class="mt-0">
                <div class="mb-3">
                    <div class="module-selection-container mr-20">
                        <div *ngFor="let module of modules" class="form-check form-switch module-item">
                            <input type="checkbox" class="form-check-input" [checked]="module.selected" (change)="onModuleChange($event, module.id)">
                            <label class="form-check-label">{{ module.name }}</label>
                        </div>
                    </div>
                </div>
                
                <!-- Documents Section -->
                <p class="text-muted text-truncate mb-2 mt-4">Documents</p>
                <hr class="mt-0">
                
                <div class="row row-gap m-0">
                    <!-- Upload Logo -->
                    <div class="col-sm-5 mb-3">
                        <label class="form-label">Upload Client Logo</label>
                        <input type="file" class="form-control" style="    padding: 4px 12px !important;" (change)="onFileSelect($event, 'logo')" accept="image/*">
                        <img *ngIf="logoPreview" [src]="logoPreview" class="mt-2" width="100" alt="Logo Preview">
                    </div>

                    <!-- Upload Documents -->
                    <div class="col-sm-5 mb-3">
                        <label class="form-label">Upload Client Documents</label>
                        <input type="file" class="form-control" style="    padding: 4px 12px !important;" (change)="onFileSelect($event, 'documents')" multiple accept=".pdf,.doc,.docx">
                        <ul *ngIf="uploadedDocuments.length > 0" class="mt-2">
                            <li *ngFor="let doc of uploadedDocuments">{{ doc.name }}</li>
                        </ul>
                    </div>
                </div>
                
                <hr>
                <button type="submit" [disabled]="clientForm.invalid" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
